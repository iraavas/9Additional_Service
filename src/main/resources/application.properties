statistics.observability=true

observability.intervals=10,30,60

service.statistic.observability.delay=5000

server.port=${SERVER_PORT:8082}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.client.RestTemplate=OFF

spring.flyway.enabled=false

main.service.host=${MAIN_SERVICE_HOST:spring-boot-app}
main.service.port=${MAIN_SERVICE_PORT:8081}

server.tomcat.threads.max=${TOMCAT_THREADS:100}


spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

doctor.cache.ttl-seconds=${REDIS_TTL_SECONDS:1800}
spring.data.redis.password=${REDIS_PASSWORD:password}

management.endpoints.web.exposure.include=*