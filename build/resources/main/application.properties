statistics.observability=true
observability.intervals=10,30,60
service.statistic.observability.delay=5000

server.port=${SERVER_PORT:8082}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.client.RestTemplate=OFF

spring.flyway.enabled=false

main.service.host=${MAIN_SERVICE_HOST:spring-boot-app}
main.service.port=${MAIN_SERVICE_PORT:8081}

server.tomcat.threads.max=${TOMCAT_THREADS:100}

resilience4j.circuitbreaker.instances.MAIN_SERVICE.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.MAIN_SERVICE.sliding-window-size=10
resilience4j.circuitbreaker.instances.MAIN_SERVICE.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.MAIN_SERVICE.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.MAIN_SERVICE.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.MAIN_SERVICE.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.MAIN_SERVICE.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.MAIN_SERVICE.register-health-indicator=true

resilience4j.retry.instances.MAIN_SERVICE.retry-exceptions=org.springframework.web.client.ResourceAccessException
resilience4j.retry.instances.MAIN_SERVICE.ignore-exceptions=java.lang.IllegalArgumentException
resilience4j.retry.instances.MAIN_SERVICE.max-attempts=${RETRY_MAX_ATTEMPTS:7}
resilience4j.retry.instances.MAIN_SERVICE.wait-duration=${RETRY_WAIT_DURATION:10s}

management.endpoints.web.exposure.include=*